<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SpaceSim Reactorium</title><link rel="stylesheet" href="reactorium.css"></head>
<body><main class="station-shell">
<header class="topbar"><div><p class="eyebrow">SPACESIM / STATION 02</p><h1>REACTORIUM</h1></div><div class="topbar-status"><span id="status-dot" class="status-dot"></span><span id="reactor-status">OFFLINE</span><span class="divider"></span><span id="tick-label">TICK 000000</span></div></header>
<section class="reactor-station" aria-labelledby="reactor-heading"><section class="core-panel"><div class="panel-heading"><div><p class="panel-index">CORE 01</p><h2 id="reactor-heading">Reactor Control</h2></div><span id="level-label" class="level-label">LEVEL 0 %</span></div><div class="reactor-visual"><canvas id="reactor-canvas" aria-label="Visualisierung des Reaktorkerns"></canvas></div><div class="level-control"><div class="control-heading"><label for="operating-level">OPERATING LEVEL</label><output id="level-output" for="operating-level">0 %</output></div><div class="slider-shell"><div class="slider-track"><div id="level-fill" class="level-fill"></div><i id="level-indicator" class="level-indicator"></i></div><input id="operating-level" type="range" min="0" max="100" step="5" value="0" aria-label="Betriebslevel des Reaktors"></div><div class="range-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div></section>
<section class="readout-panel" aria-label="Reactor telemetry"><p class="panel-index">LIVE TELEMETRY</p><dl class="telemetry-list"><div class="telemetry-row fuel"><dt>FUEL</dt><dd id="fuel-value">--</dd><div class="fuel-track"><div id="fuel-fill"></div></div></div><div class="telemetry-row"><dt>FUEL USAGE</dt><dd id="usage-value">--</dd></div><div class="telemetry-row"><dt>OUTPUT POWER</dt><dd id="power-value">--</dd></div><div class="telemetry-row"><dt>CURRENT DRAW</dt><dd id="draw-value">--</dd></div></dl><section class="allocation-section" aria-labelledby="allocation-heading"><div class="allocation-heading"><p id="allocation-heading" class="panel-index">POWER ALLOCATION</p><output id="allocation-total">TOTAL 100 %</output></div><div class="allocation-row"><div><label for="bridge-allocation">BRÜCKE</label><output id="bridge-allocation-value">-- PU</output></div><div class="allocation-slider"><div><i id="bridge-allocation-fill"></i></div><input id="bridge-allocation" type="range" min="0" max="100" step="1" value="40" aria-label="Leistung für die Brücke"></div></div><div class="allocation-row"><div><label for="shields-allocation">SCHILDE</label><output id="shields-allocation-value">-- PU</output></div><div class="allocation-slider"><div><i id="shields-allocation-fill"></i></div><input id="shields-allocation" type="range" min="0" max="100" step="1" value="28" aria-label="Leistung für die Schilde"></div></div><div class="allocation-row"><div><label for="armarium-allocation">ARMARIUM</label><output id="armarium-allocation-value">-- PU</output></div><div class="allocation-slider"><div><i id="armarium-allocation-fill"></i></div><input id="armarium-allocation" type="range" min="0" max="100" step="1" value="32" aria-label="Leistung für das Armarium"></div></div></section></section></section>
<footer class="footer-bar"><span>AUTHORITATIVE REACTOR CONTROL</span><span id="command-state">WAITING FOR REACTOR</span><span id="capacity-label">FUEL CAPACITY --</span></footer></main><script src="reactorium.js"></script></body></html>
