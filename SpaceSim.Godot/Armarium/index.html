<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceSim Armarium</title>
  <link rel="stylesheet" href="armarium.css">
</head>
<body>
  <main class="station">
    <header>
      <p class="eyebrow">SPACESIM / STATION 01</p>
      <h1>ARMARIUM</h1>
      <p id="connection" class="connection disconnected">ARMARIUM OFFLINE</p>
    </header>
    <section class="scope-panel" aria-label="Zielhilfe">
      <div class="scope-heading"><span>ZIELHILFE</span><span>&plusmn;7.5&deg;</span></div>
      <canvas id="scope" aria-label="Horizontal target bearing"></canvas>
      <p id="target-status">NO TARGET</p>
    </section>
    <section class="weapon-panel" aria-label="Armarium energy and lance status">
      <section class="energy-panel" aria-label="Armarium energy">
        <span>AVAILABLE ENERGY</span>
        <strong id="available-energy">0.0 / 40 PU</strong>
        <p id="lance-system-status">LANCE STATUS: OFFLINE</p>
      </section>
      <section class="lance-panel" aria-label="Lance status">
        <div class="lance-row"><span>LANCE</span><strong id="lance-label">0 %</strong></div>
        <div class="charge-track"><div id="charge-fill"></div></div>
        <p id="turret-status">TURRET 0.0&deg; / &plusmn;5&deg;</p>
      </section>
    </section>
    <section class="tactical-map-panel" aria-label="One kilometre lance tactical map">
      <div class="map-heading"><span>TACTICAL LANCE MAP</span><span>RANGE 1.0 KM</span></div>
      <canvas id="tactical-map" aria-label="Forward tactical map with lance field of fire"></canvas>
      <p id="map-status">FORWARD SECTOR &plusmn;30&deg;</p>
    </section>
    <footer><kbd>ARROWS</kbd><span>TURRET &plusmn;5&deg;</span><kbd>SPACE</kbd><span>FIRE LANCE</span><span id="protocol">PROTOCOL 7</span></footer>
  </main>
  <script src="armarium.js"></script>
</body>
</html>
