<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceSim Armarium</title>
  <link rel="stylesheet" href="armarium.css">
</head>
<body>
  <main class="station">
    <header>
      <p class="eyebrow">SPACESIM / STATION 01</p>
      <h1>ARMARIUM</h1>
      <p id="connection" class="connection disconnected">DISCONNECTED</p>
    </header>
    <section class="scope-panel" aria-label="Forward lance sight">
      <canvas id="scope" aria-label="Horizontal target bearing"></canvas>
      <p id="target-status">NO TARGET</p>
    </section>
    <section class="lance-panel" aria-label="Lance status">
      <div class="lance-row"><span>LANCE</span><strong id="lance-label">0 %</strong></div>
      <div class="charge-track"><div id="charge-fill"></div></div>
    </section>
    <footer><kbd>F</kbd><span>FIRE LANCE</span><span id="protocol">PROTOCOL 1</span></footer>
  </main>
  <script src="armarium.js"></script>
</body>
</html>
